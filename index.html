<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タスクノート">
  <title>タスクノート</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0a0a1e; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { width: 4px }
    ::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 4px }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.4) }
    select option { background: #1a1a3e; color: #e0e0ff; }
    input, textarea, select { -webkit-appearance: none; appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    const DEFAULT_LOCATION_OPTIONS = ["未整理", "家", "職場", "街中", "人に会う時"];
    const DEFAULT_DURATION_OPTIONS = ["すきま", "1時間", "半日", "1日", "2日以上", "毎日"];
    // 日付の固定選択肢（カレンダー入力と併用）
    const DATE_PRESETS = ["今日", "明日", "今週", "来週", "いつか"];
    const LOCATION_ICONS = { "未整理": "📥", "家": "🏠", "職場": "💼", "街中": "🏙️", "人に会う時": "🤝" };
    const DATE_COLORS = { "今日": "#ef4444", "明日": "#f97316", "今週": "#eab308", "来週": "#3b82f6", "いつか": "#8b5cf6" };

    // ---- 共通Fieldコンポーネント ----
    function Field({ label, children }) {
      return (
        <div>
          <div style={{ fontSize: "11px", color: "#44447a", marginBottom: "4px" }}>{label}</div>
          {children}
        </div>
      );
    }

    // ---- タグ管理モーダル ----
    function TagManagerModal({ title, options, onClose, onSave }) {
      const [items, setItems] = useState([...options]);
      const [newItem, setNewItem] = useState("");
      const inp = { background: "#0d0d22", border: "1px solid #252550", borderRadius: "8px", padding: "8px 10px", color: "#e0e0ff", fontSize: "14px", outline: "none", fontFamily: "'Noto Sans JP', sans-serif" };
      return (
        <div style={{ position: "fixed", inset: 0, background: "#000c", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: "20px" }}>
          <div style={{ background: "#11112a", border: "1px solid #252550", borderRadius: "16px", padding: "20px", width: "100%", maxWidth: "360px" }}>
            <div style={{ fontWeight: 700, fontSize: "15px", color: "#e0e0ff", marginBottom: "14px" }}>⚙️ {title}の編集</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "12px" }}>
              {items.map((item, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <span style={{ flex: 1, fontSize: "13px", color: "#ccccff", padding: "6px 10px", background: "#1a1a3a", borderRadius: "8px" }}>{item}</span>
                  <button onClick={() => setItems(items.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: "#554466", fontSize: "16px", cursor: "pointer", padding: "4px 6px" }}>✕</button>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: "6px", marginBottom: "16px" }}>
              <input placeholder="新しい項目" value={newItem} onChange={e => setNewItem(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && newItem.trim()) { setItems([...items, newItem.trim()]); setNewItem(""); }}}
                style={{ ...inp, flex: 1 }} />
              <button onClick={() => { if (newItem.trim()) { setItems([...items, newItem.trim()]); setNewItem(""); }}}
                style={{ padding: "8px 14px", background: "#2a2a6a", border: "none", borderRadius: "8px", color: "#aaaaff", cursor: "pointer", fontSize: "13px", fontFamily: "'Noto Sans JP', sans-serif" }}>追加</button>
            </div>
            <div style={{ display: "flex", gap: "8px" }}>
              <button onClick={onClose} style={{ flex: 1, padding: "10px", background: "transparent", border: "1px solid #252550", borderRadius: "8px", color: "#5555aa", cursor: "pointer", fontSize: "13px", fontFamily: "'Noto Sans JP', sans-serif" }}>キャンセル</button>
              <button onClick={() => { onSave(items); onClose(); }} style={{ flex: 2, padding: "10px", background: "linear-gradient(135deg, #3333bb, #5522bb)", border: "none", borderRadius: "8px", color: "#fff", cursor: "pointer", fontSize: "13px", fontWeight: 700, fontFamily: "'Noto Sans JP', sans-serif" }}>保存</button>
            </div>
          </div>
        </div>
      );
    }

    // ---- 日付インライン編集タグ ----
    function InlineDateTag({ value, onChange, onEditStart, onEditEnd }) {
      const [open, setOpen] = useState(false);
      const menuRef = useRef(null);
      const color = DATE_COLORS[value];
      const label = value ? value : "日付";

      const openMenu = () => {
        setOpen(true);
        onEditStart && onEditStart();
        // 外タップで閉じる
        setTimeout(() => {
          const handler = (e) => {
            if (menuRef.current && !menuRef.current.contains(e.target)) {
              setOpen(false);
              onEditEnd && onEditEnd();
              document.removeEventListener("touchstart", handler, true);
            }
          };
          document.addEventListener("touchstart", handler, true);
        }, 0);
      };
      const closeMenu = () => { setOpen(false); onEditEnd && onEditEnd(); };

      if (!open) return (
        <span data-tag="1" onClick={e => { e.stopPropagation(); openMenu(); }}
          style={{ fontSize: "10px", padding: "2px 7px", borderRadius: "999px", cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0,
            border: `1px solid ${color ? color+"88" : "#33336a"}`,
            color: color || (value ? "#7777aa" : "#333366"),
            background: color ? color+"12" : "transparent" }}>
          {label}
        </span>
      );

      return (
        <span ref={menuRef} data-tag="1" style={{ display: "inline-flex", flexWrap: "wrap", gap: "3px", alignItems: "center" }}>
          {[...DATE_PRESETS, ""].map(p => (
            <span key={p} onClick={e => { e.stopPropagation(); onChange(p); closeMenu(); }}
              style={{ fontSize: "10px", padding: "2px 7px", borderRadius: "999px", cursor: "pointer", whiteSpace: "nowrap",
                border: `1px solid ${DATE_COLORS[p] ? DATE_COLORS[p]+"88" : "#33336a"}`,
                color: DATE_COLORS[p] || "#555577",
                background: value === p ? (DATE_COLORS[p] ? DATE_COLORS[p]+"22" : "#1a1a3a") : "transparent" }}>
              {p || "—"}
            </span>
          ))}
        </span>
      );
    }

    // ---- 通常インライン編集タグ ----
    function InlineTag({ value, options, onChange, onEditStart, onEditEnd }) {
      const [editing, setEditing] = useState(false);
      const open = () => { setEditing(true); onEditStart && onEditStart(); };
      const close = () => { setEditing(false); onEditEnd && onEditEnd(); };
      return editing ? (
        <select autoFocus value={value || ""}
          onChange={e => { onChange(e.target.value); close(); }}
          onBlur={() => close()}
          style={{ fontSize: "10px", padding: "1px 4px", borderRadius: "999px", border: "1px solid #555", background: "#1a1a2e", color: "#ccc", outline: "none" }}
        >
          <option value="">—</option>
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      ) : (
        <span data-tag="1" onClick={e => { e.stopPropagation(); open(); }}
          style={{ fontSize: "10px", padding: "2px 7px", borderRadius: "999px", border: "1px solid #33336a", color: value ? "#7777aa" : "#333366", cursor: "pointer", background: "transparent", whiteSpace: "nowrap", flexShrink: 0 }}>
          {value || "—"}
        </span>
      );
    }

    // ---- タスク詳細・編集モーダル ----
    function TaskDetailModal({ task, locationOptions, durationOptions, onClose, onSave }) {
      const [data, setData] = useState({ ...task });
      const set = key => val => setData(d => ({ ...d, [key]: val }));
      const inp = { width: "100%", background: "#0d0d22", border: "1px solid #252550", borderRadius: "8px", padding: "9px 12px", color: "#e0e0ff", fontSize: "16px", outline: "none", boxSizing: "border-box", fontFamily: "'Noto Sans JP', sans-serif" };
      const sel = { ...inp, appearance: "none", WebkitAppearance: "none" };
      return (
        <div style={{ position: "fixed", inset: 0, background: "#000b", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 150 }}>
          <div style={{ background: "#11112a", border: "1px solid #252550", borderRadius: "20px 20px 0 0", padding: "20px 20px 36px", width: "100%", maxWidth: "500px", boxShadow: "0 -8px 40px #000c", maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ fontWeight: 700, fontSize: "15px", color: "#e0e0ff", marginBottom: "14px" }}>✏️ タスクを編集</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              <Field label="タスク名">
                <input value={data.name} onChange={e => set("name")(e.target.value)} style={inp} />
              </Field>
              <Field label="詳細">
                <textarea value={data.detail || ""} onChange={e => set("detail")(e.target.value)} rows={3} style={{ ...inp, resize: "none" }} />
              </Field>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                <Field label="かかる時間">
                  <select value={data.duration || ""} onChange={e => set("duration")(e.target.value)} style={sel}>
                    <option value="">—</option>
                    {durationOptions.map(o => <option key={o} value={o}>{o}</option>)}
                  </select>
                </Field>
                <Field label="場所">
                  <select value={data.location || ""} onChange={e => set("location")(e.target.value)} style={sel}>
                    <option value="">—</option>
                    {locationOptions.map(o => <option key={o} value={o}>{LOCATION_ICONS[o] || ""} {o}</option>)}
                  </select>
                </Field>
              </div>
              <Field label="日付">
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
                  {[...DATE_PRESETS, ""].map(p => (
                    <span key={p} onClick={() => set("date")(p)}
                      style={{ fontSize: "13px", padding: "6px 14px", borderRadius: "999px", cursor: "pointer",
                        border: `1px solid ${DATE_COLORS[p] ? DATE_COLORS[p]+"88" : "#33336a"}`,
                        color: DATE_COLORS[p] || "#555577",
                        background: data.date === p ? (DATE_COLORS[p] ? DATE_COLORS[p]+"22" : "#1a1a3a") : "transparent" }}>
                      {p || "—"}
                    </span>
                  ))}
                </div>
              </Field>
            </div>
            <div style={{ display: "flex", gap: "8px", marginTop: "16px" }}>
              <button onClick={onClose} style={{ flex: 1, padding: "10px", background: "transparent", border: "1px solid #252550", borderRadius: "8px", color: "#5555aa", cursor: "pointer", fontSize: "13px", fontFamily: "'Noto Sans JP', sans-serif" }}>キャンセル</button>
              <button onClick={() => { onSave(data); onClose(); }} style={{ flex: 2, padding: "10px", background: "linear-gradient(135deg, #3333bb, #5522bb)", border: "none", borderRadius: "8px", color: "#fff", cursor: "pointer", fontSize: "13px", fontWeight: 700, fontFamily: "'Noto Sans JP', sans-serif" }}>保存</button>
            </div>
          </div>
        </div>
      );
    }

    // ---- タスク行 ----
    function TaskRow({ task, locationOptions, durationOptions, isLast, globalEditingRef, globalJustClosedRef, setGlobalEditing, onRemove, onEdit, isDragOver, isDragging, onLongPressStart }) {
      const [done, setDone] = useState(false);
      const [pressing, setPressing] = useState(false);
      const pressTimer = useRef(null);
      const touchMoved = useRef(false);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);

      const handleTouchStart = e => {
        if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
        touchMoved.current = false;
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        setPressing(true);
        pressTimer.current = setTimeout(() => { setPressing(false); onLongPressStart(e, task.id); }, 300);
      };
      const handleTouchMove = e => {
        const dx = Math.abs(e.touches[0].clientX - touchStartX.current);
        const dy = Math.abs(e.touches[0].clientY - touchStartY.current);
        if (dx > 8 || dy > 8) { touchMoved.current = true; clearTimeout(pressTimer.current); setPressing(false); }
      };
      const handleTouchEnd = e => {
        clearTimeout(pressTimer.current); setPressing(false);
        if (!touchMoved.current && !isDragging) {
          if (e.target.closest("[data-check]") || e.target.closest("[data-tag]")) return;
          // タグ編集中 or 編集直後ならモーダルを開かない
          if (globalEditingRef.current || globalJustClosedRef.current) { setGlobalEditing(false); return; }
          onEdit(task);
        }
      };
      const handleCheck = e => { e.stopPropagation(); setDone(true); setTimeout(() => onRemove(task.id), 400); };
      const saveField = (key, val) => onEdit({ ...task, [key]: val }, true);
      const dateColor = DATE_COLORS[task.date];

      return (
        <div onTouchStart={handleTouchStart} onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd} onTouchCancel={() => { clearTimeout(pressTimer.current); setPressing(false); }}
          style={{ display: "grid", gridTemplateColumns: "20px 1fr", gap: "0 8px", alignItems: "center",
            padding: "7px 10px 7px 4px", borderBottom: isLast ? "none" : "1px solid #1a1a3a",
            opacity: done ? 0 : isDragging ? 0.25 : 1,
            transition: "opacity .35s ease, background .1s, transform .1s",
            background: isDragOver ? "#1e1e44" : pressing ? "#16163a" : "transparent",
            borderTop: isDragOver ? "2px solid #4444bb" : "2px solid transparent",
            userSelect: "none", transform: pressing ? "scale(0.99)" : "scale(1)" }}>

          <div data-check="1" onClick={handleCheck} style={{ width: "16px", height: "16px", borderRadius: "4px", flexShrink: 0,
            border: `1.5px solid ${done ? "#4444bb" : "#33335a"}`, background: done ? "#4444bb" : "transparent",
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "all .2s" }}>
            {done && <span style={{ color: "#fff", fontSize: "10px", lineHeight: 1 }}>✓</span>}
          </div>

          <div style={{ opacity: done ? 0.4 : 1, transition: "opacity .2s", minWidth: 0 }}>
            {/* 1行目：タイトル + 時間タグ + 日付タグ */}
            {/* 1行目：タイトル */}
            <div style={{ overflow: "hidden" }}>
              <span style={{ fontSize: "13px", fontWeight: 600, color: "#e0e0ff", textDecoration: done ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", display: "block" }}>{task.name}</span>
            </div>
            {/* 2行目：詳細 */}
            {task.detail && <div style={{ fontSize: "11px", color: "#55557a", marginTop: "1px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{task.detail}</div>}
            {/* 3行目：タグ */}
            <div style={{ display: "flex", alignItems: "center", gap: "5px", marginTop: "2px", flexWrap: "nowrap", overflow: "hidden" }}>
              <InlineDateTag value={task.date} onChange={v => saveField("date", v)} onEditStart={() => setGlobalEditing(true)} onEditEnd={() => setGlobalEditing(false)} />
              <InlineTag value={task.duration} options={durationOptions} onChange={v => saveField("duration", v)} onEditStart={() => setGlobalEditing(true)} onEditEnd={() => setGlobalEditing(false)} />
              {task.location && <span style={{ fontSize: "11px", flexShrink: 0 }}>{LOCATION_ICONS[task.location] || "📍"}</span>}
              <InlineTag value={task.location} options={locationOptions} onChange={v => saveField("location", v)} onEditStart={() => setGlobalEditing(true)} onEditEnd={() => setGlobalEditing(false)} />
            </div>
          </div>
        </div>
      );
    }

    // ---- 新規追加モーダル ----
    function AddTaskModal({ locationOptions, durationOptions, onClose, onAdd }) {
      const [name, setName] = useState("");
      const [detail, setDetail] = useState("");
      const [date, setDate] = useState("");
      const [duration, setDuration] = useState("");
      const [location, setLocation] = useState("未整理");
      const [error, setError] = useState("");


      const handleSubmit = () => {
        if (!name.trim()) { setError("タスク名を入力してください"); return; }
        onAdd({ id: Date.now(), name: name.trim(), detail, date, duration, location });
        onClose();
      };

      const inp = { width: "100%", background: "#0d0d22", border: "1px solid #252550", borderRadius: "8px", padding: "9px 12px", color: "#e0e0ff", fontSize: "16px", outline: "none", boxSizing: "border-box", fontFamily: "'Noto Sans JP', sans-serif" };
      const sel = { ...inp, appearance: "none", WebkitAppearance: "none" };

      return (
        <div style={{ position: "fixed", inset: 0, background: "#000b", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
          <div style={{ background: "#11112a", border: "1px solid #252550", borderRadius: "20px 20px 0 0", padding: "20px 20px 36px", width: "100%", maxWidth: "500px", boxShadow: "0 -8px 40px #000c", maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ fontWeight: 700, fontSize: "15px", color: "#e0e0ff", marginBottom: "14px" }}>＋ 新しいタスク</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              <Field label="タスク名 *">
                <input placeholder="例：資料を作成する" value={name} onChange={e => setName(e.target.value)} style={inp} />
              </Field>
              <Field label="詳細（任意）">
                <textarea placeholder="メモや補足など" value={detail} onChange={e => setDetail(e.target.value)} rows={2} style={{ ...inp, resize: "none" }} />
              </Field>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                <Field label="かかる時間">
                  <select value={duration} onChange={e => setDuration(e.target.value)} style={sel}>
                    <option value="">—</option>
                    {durationOptions.map(o => <option key={o} value={o}>{o}</option>)}
                  </select>
                </Field>
                <Field label="場所">
                  <select value={location} onChange={e => setLocation(e.target.value)} style={sel}>
                    {locationOptions.map(o => <option key={o} value={o}>{LOCATION_ICONS[o] || ""} {o}</option>)}
                  </select>
                </Field>
              </div>
              <Field label="日付">
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
                  {[...DATE_PRESETS, ""].map(p => (
                    <span key={p} onClick={() => setDate(p)}
                      style={{ fontSize: "13px", padding: "6px 14px", borderRadius: "999px", cursor: "pointer",
                        border: `1px solid ${DATE_COLORS[p] ? DATE_COLORS[p]+"88" : "#33336a"}`,
                        color: DATE_COLORS[p] || "#555577",
                        background: date === p ? (DATE_COLORS[p] ? DATE_COLORS[p]+"22" : "#1a1a3a") : "transparent" }}>
                      {p || "—"}
                    </span>
                  ))}
                </div>
              </Field>
            </div>
            {error && <div style={{ color: "#ef4444", fontSize: "11px", marginTop: "8px" }}>{error}</div>}
            <div style={{ display: "flex", gap: "8px", marginTop: "16px" }}>
              <button onClick={onClose} style={{ flex: 1, padding: "10px", background: "transparent", border: "1px solid #252550", borderRadius: "8px", color: "#5555aa", cursor: "pointer", fontSize: "13px", fontFamily: "'Noto Sans JP', sans-serif" }}>キャンセル</button>
              <button onClick={handleSubmit} style={{ flex: 2, padding: "10px", background: "linear-gradient(135deg, #3333bb, #5522bb)", border: "none", borderRadius: "8px", color: "#fff", cursor: "pointer", fontSize: "13px", fontWeight: 700, fontFamily: "'Noto Sans JP', sans-serif" }}>追加</button>
            </div>
          </div>
        </div>
      );
    }

    // ---- サンプルデータ ----
    const SAMPLE_TASKS = [
      { id: 1,  name: "週次レポートの作成",       detail: "売上データをまとめてマネージャーに提出", date: "今週",  duration: "半日",   location: "職場" },
      { id: 2,  name: "歯医者の予約",             detail: "",                                     date: "今週",  duration: "すきま", location: "街中" },
      { id: 3,  name: "Pythonの勉強",             detail: "データ分析の基礎",                      date: "来週",  duration: "1時間",  location: "家" },
      { id: 4,  name: "クライアントへのメール返信", detail: "",                                     date: "今日",  duration: "すきま", location: "職場" },
      { id: 5,  name: "スーパーで買い物",          detail: "夕食の食材を買う",                      date: "今日",  duration: "すきま", location: "街中" },
      { id: 6,  name: "読書",                     detail: "「エッセンシャル思考」を読む",            date: "いつか", duration: "1時間", location: "家" },
      { id: 7,  name: "プレゼン資料の作成",        detail: "来月の全社会議向け",                     date: "来週",  duration: "2日以上", location: "職場" },
      { id: 8,  name: "友人と食事の約束",          detail: "",                                     date: "2026-06-07", duration: "半日", location: "人に会う時" },
      { id: 9,  name: "ジムに行く",               detail: "",                                     date: "",      duration: "毎日",   location: "街中" },
      { id: 10, name: "確定申告の書類整理",        detail: "領収書をまとめておく",                   date: "いつか", duration: "1日",   location: "家" },
      { id: 11, name: "やること未定のタスク",      detail: "",                                     date: "",      duration: "",       location: "未整理" },
    ];

    // ---- メインApp ----
    function App() {
      const [tasks, setTasks] = useState(SAMPLE_TASKS);
      const [showModal, setShowModal] = useState(false);
      const [editTask, setEditTask] = useState(null);
      const [filter, setFilter] = useState("未整理");
      const [tagManager, setTagManager] = useState(null);
      const [draggingId, setDraggingId] = useState(null);
      const [dragOverId, setDragOverId] = useState(null);
      const [locationOptions, setLocationOptions] = useState(DEFAULT_LOCATION_OPTIONS);
      const [durationOptions, setDurationOptions] = useState(DEFAULT_DURATION_OPTIONS);
      const [sortMode, setSortMode] = useState("manual"); // "manual" | "date"
      const globalEditingRef = useRef(false); // どこかのタグが編集中かどうか
      const globalJustClosedRef = useRef(false);
      const setGlobalEditing = (v) => {
        globalEditingRef.current = v;
        if (!v) {
          globalJustClosedRef.current = true;
          setTimeout(() => { globalJustClosedRef.current = false; }, 300);
        }
      };

      const draggingIdRef = useRef(null);
      const dragOverIdRef = useRef(null);
      const ghostRef = useRef(null);
      const touchOffsetY = useRef(0);
      const rowRefs = useRef({});
      const swipeStartX = useRef(null);
      const swipeStartY = useRef(null);

      const TAB_OPTIONS = [...locationOptions, "すべて"];
      const DATE_ORDER_MAP = { "今日": 0, "明日": 1, "今週": 2, "来週": 3, "いつか": 99 };
      const DURATION_ORDER_MAP = { "毎日": 0, "2日以上": 1, "1日": 2, "半日": 3, "1時間": 4, "すきま": 5 };
      const filtered = (() => {
        const base = tasks.filter(t => filter === "すべて" || t.location === filter);
        if (sortMode === "manual") return base;
        return [...base].sort((a, b) => {
          const da = a.date || "", db = b.date || "";
          const oa = DATE_ORDER_MAP[da] !== undefined ? DATE_ORDER_MAP[da] : (da ? 50 : 100);
          const ob = DATE_ORDER_MAP[db] !== undefined ? DATE_ORDER_MAP[db] : (db ? 50 : 100);
          if (oa !== ob) return oa - ob;
          if (da !== db) return da > db ? 1 : -1;
          const dura = DURATION_ORDER_MAP[a.duration] !== undefined ? DURATION_ORDER_MAP[a.duration] : 99;
          const durb = DURATION_ORDER_MAP[b.duration] !== undefined ? DURATION_ORDER_MAP[b.duration] : 99;
          return dura - durb;
        });
      })();

      const SENTINEL_LAST = -1; // 末尾挿入用の番兵
      const reorder = useCallback((fromId, toId) => {
        if (!fromId || toId === undefined) return;
        setTasks(prev => {
          const next = [...prev];
          const fi = next.findIndex(t => t.id === fromId);
          if (fi < 0) return prev;
          const [moved] = next.splice(fi, 1);
          if (toId === -1) {
            next.push(moved); // 末尾
          } else if (toId === -2) {
            next.unshift(moved); // 先頭
          } else {
            const ti = next.findIndex(t => t.id === toId);
            if (ti < 0) { next.push(moved); }
            else { next.splice(ti, 0, moved); }
          }
          return next.map((t, i) => ({ ...t, manualOrder: i }));
        });
      }, []);

      const handleLongPressStart = useCallback((e, id) => {
        const touch = e.touches[0];
        draggingIdRef.current = id; setDraggingId(id);
        if (navigator.vibrate) navigator.vibrate(30);
        const el = rowRefs.current[id];
        if (el) {
          const rect = el.getBoundingClientRect();
          touchOffsetY.current = touch.clientY - rect.top;
          const g = el.cloneNode(true);
          g.style.cssText = `position:fixed;left:${rect.left+4}px;top:${rect.top}px;width:${rect.width-8}px;opacity:0.9;pointer-events:none;z-index:999;background:#22224a;border-radius:10px;box-shadow:0 12px 40px #0009;transition:none;`;
          document.body.appendChild(g); ghostRef.current = g;
        }
        const onMove = ev => {
          ev.preventDefault();
          const t = ev.touches[0];
          if (ghostRef.current) ghostRef.current.style.top = `${t.clientY - touchOffsetY.current}px`;

          const entries = Object.entries(rowRefs.current)
            .filter(([, el]) => el)
            .map(([rid, el]) => ({ id: parseInt(rid), rect: el.getBoundingClientRect() }))
            .sort((a, b) => a.rect.top - b.rect.top);

          if (entries.length === 0) return;

          // 先頭行より上 → 先頭挿入（SENTINEL_FIRST = -2）
          if (t.clientY < entries[0].rect.top) {
            dragOverIdRef.current = -2;
            setDragOverId(-2);
            return;
          }

          // 末尾行より下 → 末尾挿入（SENTINEL_LAST = -1）
          if (t.clientY > entries[entries.length - 1].rect.bottom) {
            dragOverIdRef.current = -1;
            setDragOverId(-1);
            return;
          }

          // 各行の中間点で判定：中間より上ならその行の前、下なら次の行の前
          for (let i = 0; i < entries.length; i++) {
            const { id, rect } = entries[i];
            const mid = rect.top + rect.height / 2;
            if (t.clientY <= mid) {
              dragOverIdRef.current = id;
              setDragOverId(id);
              return;
            }
            if (i === entries.length - 1) {
              // 最後の行の中間より下 → 末尾
              dragOverIdRef.current = -1;
              setDragOverId(-1);
            }
          }
        };
        const onEnd = () => {
          if (ghostRef.current) { ghostRef.current.remove(); ghostRef.current = null; }
          reorder(draggingIdRef.current, dragOverIdRef.current !== null ? dragOverIdRef.current : undefined);
          draggingIdRef.current = null; dragOverIdRef.current = null;
          setDraggingId(null); setDragOverId(null);
          document.removeEventListener("touchmove", onMove);
          document.removeEventListener("touchend", onEnd);
        };
        document.addEventListener("touchmove", onMove, { passive: false });
        document.addEventListener("touchend", onEnd);
      }, [reorder]);

      const filterIndex = TAB_OPTIONS.indexOf(filter);
      const handleSwipeStart = e => {
        if (e.touches.length !== 1) return;
        swipeStartX.current = e.touches[0].clientX;
        swipeStartY.current = e.touches[0].clientY;
      };
      const handleSwipeEnd = e => {
        if (swipeStartX.current === null) return;
        const dx = e.changedTouches[0].clientX - swipeStartX.current;
        const dy = e.changedTouches[0].clientY - swipeStartY.current;
        swipeStartX.current = null;
        if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
        if (dx < 0 && filterIndex < TAB_OPTIONS.length - 1) setFilter(TAB_OPTIONS[filterIndex + 1]);
        else if (dx > 0 && filterIndex > 0) setFilter(TAB_OPTIONS[filterIndex - 1]);
      };

      return (
        <div onTouchStart={handleSwipeStart} onTouchEnd={handleSwipeEnd}
          style={{ minHeight: "100vh", background: "#0a0a1e", fontFamily: "'Noto Sans JP', sans-serif", padding: "0 0 100px", paddingTop: "env(safe-area-inset-top)" }}>
          <div style={{ maxWidth: "600px", margin: "0 auto" }}>

            <div style={{ display: "flex", gap: "4px", padding: "12px 16px 6px", overflowX: "auto" }}>
              {TAB_OPTIONS.map(f => (
                <button key={f} onClick={() => setFilter(f)} style={{
                  padding: "4px 11px", borderRadius: "999px", fontSize: "11px", cursor: "pointer",
                  transition: "all .15s", whiteSpace: "nowrap", flexShrink: 0,
                  background: filter === f ? "#3333bb" : "transparent",
                  border: filter === f ? "none" : "1px solid #22225a",
                  color: filter === f ? "#fff" : "#55558a",
                  fontFamily: "'Noto Sans JP', sans-serif"
                }}>
                  {LOCATION_ICONS[f] ? LOCATION_ICONS[f]+" " : ""}{f}
                </button>
              ))}
            </div>

            <div style={{ display: "flex", gap: "6px", padding: "4px 16px 8px" }}>
              {[["場所", "location"], ["時間", "duration"]].map(([label, key]) => (
                <button key={key} onClick={() => setTagManager(key)} style={{
                  padding: "3px 10px", borderRadius: "999px", fontSize: "10px",
                  background: "transparent", border: "1px solid #1f1f4a",
                  color: "#33336a", cursor: "pointer", fontFamily: "'Noto Sans JP', sans-serif"
                }}>⚙ {label}</button>
              ))}
              <button onClick={() => setSortMode(m => m === "manual" ? "date" : "manual")} style={{
                padding: "3px 10px", borderRadius: "999px", fontSize: "10px",
                background: sortMode === "date" ? "#1a1a4a" : "transparent",
                border: sortMode === "date" ? "1px solid #3333bb" : "1px solid #1f1f4a",
                color: sortMode === "date" ? "#7777cc" : "#33336a",
                cursor: "pointer", fontFamily: "'Noto Sans JP', sans-serif"
              }}>⚙ 並び替え: {sortMode === "date" ? "日付順" : "手動"}</button>
            </div>

            <div style={{ fontSize: "10px", color: "#33336a", marginBottom: "6px", padding: "0 16px", fontFamily: "'Space Mono', monospace" }}>{filtered.length} タスク</div>

            <div style={{ margin: "0 12px", background: "#0d0d24", border: "1px solid #1a1a3a", borderRadius: "12px", overflow: "hidden" }}>
              {filtered.length === 0 ? (
                <div style={{ textAlign: "center", color: "#2a2a5a", padding: "32px 0", fontSize: "13px" }}>タスクがありません</div>
              ) : (
                <div style={{ padding: "0 12px" }}>
                  <div style={{ height: "0px", borderTop: dragOverId === -2 ? "2px solid #4444bb" : "2px solid transparent", margin: "0 -12px", transition: "border-color .1s" }} />
                  {filtered.map((t, idx) => (
                    <div key={t.id} ref={el => rowRefs.current[t.id] = el}>
                      <TaskRow task={t} locationOptions={locationOptions} durationOptions={durationOptions}
                        isLast={idx === filtered.length - 1}
                        globalEditingRef={globalEditingRef} globalJustClosedRef={globalJustClosedRef} setGlobalEditing={setGlobalEditing}
                        onRemove={id => setTasks(ts => ts.filter(t => t.id !== id))}
                        onEdit={(updated, immediate) => {
                          if (immediate) setTasks(ts => ts.map(t => t.id === updated.id ? updated : t));
                          else setEditTask(updated);
                        }}
                        isDragOver={dragOverId === t.id} isDragging={draggingId === t.id}
                        onLongPressStart={handleLongPressStart} />
                    </div>
                  ))}
                  <div style={{ height: "0px", borderTop: dragOverId === -1 ? "2px solid #4444bb" : "2px solid transparent", margin: "0 -12px", transition: "border-color .1s" }} />
                </div>
              )}
            </div>

            <div style={{ textAlign: "center", fontSize: "10px", color: "#1f1f44", marginTop: "10px", fontFamily: "'Space Mono', monospace" }}>
              タップで編集　／　長押しで並び替え
            </div>
          </div>

          <button onClick={() => setShowModal(true)} style={{ position: "fixed", bottom: "calc(28px + env(safe-area-inset-bottom))", right: "24px", width: "56px", height: "56px", borderRadius: "50%", background: "linear-gradient(135deg, #3333bb, #5522bb)", border: "none", color: "#fff", fontSize: "26px", cursor: "pointer", boxShadow: "0 4px 20px #3333bb88", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>＋</button>

          {showModal && <AddTaskModal locationOptions={locationOptions} durationOptions={durationOptions} onClose={() => setShowModal(false)} onAdd={t => setTasks(ts => [t, ...ts])} />}
          {editTask && <TaskDetailModal task={editTask} locationOptions={locationOptions} durationOptions={durationOptions}
            onClose={() => setEditTask(null)}
            onSave={updated => { setTasks(ts => ts.map(t => t.id === updated.id ? updated : t)); setEditTask(null); }} />}
          {tagManager === "location" && <TagManagerModal title="場所" options={locationOptions} onClose={() => setTagManager(null)} onSave={v => setLocationOptions(v)} />}
          {tagManager === "duration" && <TagManagerModal title="かかる時間" options={durationOptions} onClose={() => setTagManager(null)} onSave={v => setDurationOptions(v)} />}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(e) { return { error: e.message }; }
      render() {
        if (this.state.error) return (
          <div style={{ color:"#fff", background:"#300", padding:"20px", fontFamily:"monospace", whiteSpace:"pre-wrap" }}>
            エラー: {this.state.error}
          </div>
        );
        return this.props.children;
      }
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>

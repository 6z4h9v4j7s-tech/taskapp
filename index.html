<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タスクノート">
  <title>タスクノート</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0a0a1e; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
    @keyframes spin { to { transform: rotate(360deg) } }
    ::-webkit-scrollbar { width: 4px }
    ::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 4px }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.4) }
    select option { background: #1a1a3e; color: #e0e0ff; }
    input, textarea, select { -webkit-appearance: none; appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useCallback } = React;

    const DURATION_OPTIONS = ["15分", "30分", "1時間", "2時間", "半日", "1日"];
    const LOCATION_OPTIONS = ["家", "職場", "通勤中", "人に会う時", "街中"];
    const URGENCY_OPTIONS = ["今日", "今週", "来週", "いつか"];
    const CATEGORY_OPTIONS = ["仕事", "学習", "連絡", "買い物・用事", "健康", "創作", "その他"];
    const LOCATION_ICONS = { "家": "🏠", "職場": "💼", "通勤中": "🚃", "人に会う時": "🤝", "街中": "🏙️" };
    const URGENCY_COLORS = { "今日": "#ef4444", "今週": "#f97316", "来週": "#3b82f6", "いつか": "#8b5cf6" };

    function EditableTag({ value, options, onChange, colorMap }) {
      const [editing, setEditing] = useState(false);
      const color = colorMap?.[value];
      return editing ? (
        <select autoFocus value={value}
          onChange={e => { onChange(e.target.value); setEditing(false); }}
          onBlur={() => setEditing(false)}
          style={{ fontSize: "10px", padding: "1px 4px", borderRadius: "999px", border: `1px solid ${color || "#555"}`, background: "#1a1a2e", color: color || "#ccc", cursor: "pointer", outline: "none" }}
        >
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      ) : (
        <span onClick={e => { e.stopPropagation(); setEditing(true); }}
          style={{ fontSize: "10px", padding: "2px 7px", borderRadius: "999px", border: `1px solid ${color ? color + "88" : "#33336a"}`, color: color || "#7777aa", cursor: "pointer", background: color ? `${color}12` : "transparent", whiteSpace: "nowrap", flexShrink: 0 }}
        >{value}</span>
      );
    }

    function TaskRow({ task, onRemove, isDragOver, isDragging, onLongPressStart }) {
      const [data, setData] = useState(task);
      const [done, setDone] = useState(false);
      const [pressing, setPressing] = useState(false);
      const set = (key) => (val) => setData(d => ({ ...d, [key]: val }));
      const pressTimer = useRef(null);
      const LONG_PRESS_MS = 300;

      const handleTouchStart = (e) => {
        if (e.target.tagName === "SELECT") return;
        setPressing(true);
        pressTimer.current = setTimeout(() => {
          setPressing(false);
          onLongPressStart(e, data.id);
        }, LONG_PRESS_MS);
      };

      const handleTouchEnd = () => {
        clearTimeout(pressTimer.current);
        setPressing(false);
      };

      const handleCheck = (e) => {
        e.stopPropagation();
        setDone(true);
        setTimeout(() => onRemove(data.id), 400);
      };

      return (
        <div
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
          onTouchCancel={handleTouchEnd}
          style={{
            display: "grid", gridTemplateColumns: "20px 1fr", gap: "0 8px",
            alignItems: "center", padding: "7px 10px 7px 4px",
            borderBottom: "1px solid #1a1a3a",
            opacity: done ? 0 : isDragging ? 0.25 : 1,
            transition: "opacity .35s ease, background .1s, transform .1s",
            background: isDragOver ? "#1e1e44" : pressing ? "#16163a" : "transparent",
            borderTop: isDragOver ? "2px solid #4444bb" : "2px solid transparent",
            userSelect: "none",
            transform: pressing ? "scale(0.99)" : "scale(1)",
          }}
        >
          <div onClick={handleCheck} style={{
            width: "16px", height: "16px", borderRadius: "4px", flexShrink: 0,
            border: `1.5px solid ${done ? "#4444bb" : "#33335a"}`,
            background: done ? "#4444bb" : "transparent",
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "all .2s"
          }}>
            {done && <span style={{ color: "#fff", fontSize: "10px", lineHeight: 1 }}>✓</span>}
          </div>
          <div style={{ opacity: done ? 0.4 : 1, transition: "opacity .2s", minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: "5px", overflow: "hidden" }}>
              <span style={{ fontSize: "13px", fontWeight: 600, color: "#e0e0ff", textDecoration: done ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flexShrink: 1 }}>{data.name}</span>
              <EditableTag value={data.urgency} options={URGENCY_OPTIONS} onChange={set("urgency")} colorMap={URGENCY_COLORS} />
              <EditableTag value={data.duration} options={DURATION_OPTIONS} onChange={set("duration")} />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "5px", marginTop: "2px", overflow: "hidden" }}>
              <span style={{ fontSize: "11px", flexShrink: 0 }}>{LOCATION_ICONS[data.location]}</span>
              <EditableTag value={data.location} options={LOCATION_OPTIONS} onChange={set("location")} />
              <EditableTag value={data.category} options={CATEGORY_OPTIONS} onChange={set("category")} />
              {data.deadline && <span style={{ fontSize: "10px", color: "#44446a", whiteSpace: "nowrap" }}>締切 <span style={{ color: "#5555aa" }}>{data.deadline}</span></span>}
              {data.startDate && <span style={{ fontSize: "10px", color: "#44446a", whiteSpace: "nowrap" }}>着手 <span style={{ color: "#5555aa" }}>{data.startDate}</span></span>}
            </div>
          </div>
        </div>
      );
    }

    function AddTaskModal({ onClose, onAdd }) {
      const [name, setName] = useState("");
      const [detail, setDetail] = useState("");
      const [deadline, setDeadline] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const today = new Date().toISOString().split("T")[0];

      const handleSubmit = async () => {
        if (!name.trim()) { setError("タスク名を入力してください"); return; }
        setLoading(true); setError("");
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514", max_tokens: 1000,
              messages: [{ role: "user", content: `あなたはタスク管理アシスタントです。以下のタスク情報を分析して、JSON形式のみで返してください。前置きや説明は不要です。\nタスク名: ${name}\n詳細: ${detail || "なし"}\n締め切り: ${deadline || "なし"}\n今日の日付: ${today}\n\n{"duration":"15分 or 30分 or 1時間 or 2時間 or 半日 or 1日","location":"家 or 職場 or 通勤中 or 人に会う時 or 街中","category":"仕事 or 学習 or 連絡 or 買い物・用事 or 健康 or 創作 or その他","urgency":"今日 or 今週 or 来週 or いつか","startDate":"YYYY-MM-DD or null"}` }]
            })
          });
          const d = await res.json();
          const parsed = JSON.parse(d.content.map(b => b.text || "").join("").replace(/```json|```/g, "").trim());
          onAdd({ id: Date.now(), name: name.trim(), detail: detail.trim(), deadline, duration: parsed.duration, location: parsed.location, category: parsed.category, urgency: parsed.urgency, startDate: parsed.startDate || "" });
          onClose();
        } catch { setError("AI分析に失敗しました。もう一度お試しください。"); }
        finally { setLoading(false); }
      };

      const inp = { width: "100%", background: "#0d0d22", border: "1px solid #252550", borderRadius: "8px", padding: "11px 12px", color: "#e0e0ff", fontSize: "16px", outline: "none", boxSizing: "border-box", fontFamily: "'Noto Sans JP', sans-serif" };

      return (
        <div style={{ position: "fixed", inset: 0, background: "#000b", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: "20px" }}>
          <div style={{ background: "#11112a", border: "1px solid #252550", borderRadius: "16px", padding: "24px", width: "100%", maxWidth: "400px", boxShadow: "0 20px 60px #000c" }}>
            <div style={{ fontWeight: 700, fontSize: "16px", color: "#e0e0ff", marginBottom: "18px" }}>✦ 新しいタスク</div>
            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              <input placeholder="タスク名 *" value={name} onChange={e => setName(e.target.value)} style={inp} onFocus={e => e.target.style.borderColor = "#4444bb"} onBlur={e => e.target.style.borderColor = "#252550"} />
              <textarea placeholder="詳細（任意）" value={detail} onChange={e => setDetail(e.target.value)} rows={2} style={{ ...inp, resize: "none" }} onFocus={e => e.target.style.borderColor = "#4444bb"} onBlur={e => e.target.style.borderColor = "#252550"} />
              <div>
                <div style={{ fontSize: "10px", color: "#44447a", marginBottom: "4px" }}>締め切り（任意）</div>
                <input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} style={inp} onFocus={e => e.target.style.borderColor = "#4444bb"} onBlur={e => e.target.style.borderColor = "#252550"} />
              </div>
            </div>
            {error && <div style={{ color: "#ef4444", fontSize: "11px", marginTop: "8px" }}>{error}</div>}
            <div style={{ display: "flex", gap: "8px", marginTop: "18px" }}>
              <button onClick={onClose} style={{ flex: 1, padding: "12px", background: "transparent", border: "1px solid #252550", borderRadius: "8px", color: "#5555aa", cursor: "pointer", fontSize: "15px", fontFamily: "'Noto Sans JP', sans-serif" }}>キャンセル</button>
              <button onClick={handleSubmit} disabled={loading} style={{ flex: 2, padding: "12px", background: loading ? "#252550" : "linear-gradient(135deg, #3333bb, #5522bb)", border: "none", borderRadius: "8px", color: "#fff", cursor: loading ? "not-allowed" : "pointer", fontSize: "15px", fontWeight: 700, fontFamily: "'Noto Sans JP', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", gap: "6px" }}>
                {loading ? <><span style={{ animation: "spin 1s linear infinite", display: "inline-block" }}>⟳</span>AI分析中…</> : "✦ AIで分析して追加"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const SAMPLE_TASKS = [
      { id: 1, name: "週次レポートの作成", detail: "売上データをまとめてマネージャーに提出", deadline: "2026-05-30", startDate: "2026-05-28", duration: "2時間", location: "職場", category: "仕事", urgency: "今週" },
      { id: 2, name: "歯医者の予約", detail: "", deadline: "", startDate: "", duration: "15分", location: "街中", category: "健康", urgency: "今週" },
      { id: 3, name: "Pythonの勉強", detail: "データ分析の基礎", deadline: "2026-06-30", startDate: "2026-06-01", duration: "1時間", location: "家", category: "学習", urgency: "来週" },
      { id: 4, name: "クライアントへのメール返信", detail: "", deadline: "2026-05-27", startDate: "2026-05-26", duration: "30分", location: "職場", category: "連絡", urgency: "今日" },
      { id: 5, name: "スーパーで買い物", detail: "夕食の食材を買う", deadline: "", startDate: "", duration: "30分", location: "街中", category: "買い物・用事", urgency: "今日" },
      { id: 6, name: "読書", detail: "「エッセンシャル思考」を読む", deadline: "", startDate: "", duration: "1時間", location: "家", category: "学習", urgency: "いつか" },
      { id: 7, name: "プレゼン資料の作成", detail: "来月の全社会議向け", deadline: "2026-06-10", startDate: "2026-06-03", duration: "半日", location: "職場", category: "仕事", urgency: "来週" },
      { id: 8, name: "友人と食事の約束", detail: "大学時代の友人と久しぶりに", deadline: "2026-06-07", startDate: "2026-06-06", duration: "2時間", location: "人に会う時", category: "その他", urgency: "来週" },
      { id: 9, name: "ジムに行く", detail: "", deadline: "", startDate: "", duration: "1時間", location: "街中", category: "健康", urgency: "今週" },
      { id: 10, name: "確定申告の書類整理", detail: "領収書をまとめておく", deadline: "2026-07-01", startDate: "2026-06-15", duration: "2時間", location: "家", category: "仕事", urgency: "いつか" },
    ];

    function App() {
      const [tasks, setTasks] = useState(SAMPLE_TASKS);
      const [showModal, setShowModal] = useState(false);
      const [filter, setFilter] = useState("すべて");
      const [draggingId, setDraggingId] = useState(null);
      const [dragOverId, setDragOverId] = useState(null);

      const draggingIdRef = useRef(null);
      const dragOverIdRef = useRef(null);
      const ghostRef = useRef(null);
      const touchOffsetY = useRef(0);
      const rowRefs = useRef({});

      const filtered = tasks.filter(t => filter === "すべて" || t.location === filter);
      const locationFilters = ["すべて", ...LOCATION_OPTIONS];

      const reorder = useCallback((fromId, toId) => {
        if (!fromId || !toId || fromId === toId) return;
        setTasks(prev => {
          const next = [...prev];
          const fi = next.findIndex(t => t.id === fromId);
          const ti = next.findIndex(t => t.id === toId);
          if (fi < 0 || ti < 0) return prev;
          const [moved] = next.splice(fi, 1);
          next.splice(ti, 0, moved);
          return next;
        });
      }, []);

      const handleLongPressStart = useCallback((e, id) => {
        const touch = e.touches[0];
        draggingIdRef.current = id;
        setDraggingId(id);
        if (navigator.vibrate) navigator.vibrate(30);

        const el = rowRefs.current[id];
        if (el) {
          const rect = el.getBoundingClientRect();
          touchOffsetY.current = touch.clientY - rect.top;
          const g = el.cloneNode(true);
          g.style.cssText = `position:fixed;left:${rect.left + 4}px;top:${rect.top}px;width:${rect.width - 8}px;opacity:0.9;pointer-events:none;z-index:999;background:#22224a;border-radius:10px;box-shadow:0 12px 40px #0009;transition:none;`;
          document.body.appendChild(g);
          ghostRef.current = g;
        }

        const onMove = (ev) => {
          ev.preventDefault();
          const t = ev.touches[0];
          if (ghostRef.current) ghostRef.current.style.top = `${t.clientY - touchOffsetY.current}px`;
          for (const [rid, rEl] of Object.entries(rowRefs.current)) {
            if (!rEl) continue;
            const rect = rEl.getBoundingClientRect();
            if (t.clientY >= rect.top && t.clientY <= rect.bottom) {
              const overId = parseInt(rid);
              if (overId !== draggingIdRef.current) {
                dragOverIdRef.current = overId;
                setDragOverId(overId);
              }
              break;
            }
          }
        };

        const onEnd = () => {
          if (ghostRef.current) { ghostRef.current.remove(); ghostRef.current = null; }
          reorder(draggingIdRef.current, dragOverIdRef.current);
          draggingIdRef.current = null;
          dragOverIdRef.current = null;
          setDraggingId(null);
          setDragOverId(null);
          document.removeEventListener("touchmove", onMove);
          document.removeEventListener("touchend", onEnd);
        };

        document.addEventListener("touchmove", onMove, { passive: false });
        document.addEventListener("touchend", onEnd);
      }, [reorder]);

      return (
        <div style={{ minHeight: "100vh", background: "#0a0a1e", fontFamily: "'Noto Sans JP', sans-serif", padding: "20px 16px" }}>
          <div style={{ maxWidth: "600px", margin: "0 auto" }}>
            <div style={{ marginBottom: "16px" }}>
              <div style={{ fontSize: "10px", letterSpacing: "3px", color: "#33337a", fontFamily: "'Space Mono', monospace" }}>AI TASK MANAGER</div>
              <h1 style={{ margin: "2px 0 0", fontSize: "20px", fontWeight: 700, color: "#e0e0ff" }}>タスクノート</h1>
            </div>

            <div style={{ display: "flex", gap: "4px", marginBottom: "12px", overflowX: "auto", paddingBottom: "2px" }}>
              {locationFilters.map(f => (
                <button key={f} onClick={() => setFilter(f)} style={{ padding: "4px 11px", borderRadius: "999px", fontSize: "11px", cursor: "pointer", transition: "all .15s", whiteSpace: "nowrap", flexShrink: 0, background: filter === f ? "#3333bb" : "transparent", border: filter === f ? "none" : "1px solid #22225a", color: filter === f ? "#fff" : "#55558a", fontFamily: "'Noto Sans JP', sans-serif" }}>
                  {f !== "すべて" ? LOCATION_ICONS[f] + " " : ""}{f}
                </button>
              ))}
            </div>

            <div style={{ fontSize: "10px", color: "#33336a", marginBottom: "8px", fontFamily: "'Space Mono', monospace" }}>{filtered.length} タスク</div>

            <div style={{ background: "#0d0d24", border: "1px solid #1a1a3a", borderRadius: "12px", overflow: "hidden" }}>
              {filtered.length === 0 ? (
                <div style={{ textAlign: "center", color: "#2a2a5a", padding: "32px 0", fontSize: "13px" }}>タスクがありません</div>
              ) : (
                <div style={{ padding: "0 12px" }}>
                  {filtered.map(t => (
                    <div key={t.id} ref={el => rowRefs.current[t.id] = el}>
                      <TaskRow
                        task={t}
                        onRemove={id => setTasks(ts => ts.filter(t => t.id !== id))}
                        isDragOver={dragOverId === t.id}
                        isDragging={draggingId === t.id}
                        onLongPressStart={handleLongPressStart}
                      />
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ textAlign: "center", fontSize: "10px", color: "#1f1f44", marginTop: "12px", marginBottom: "100px", fontFamily: "'Space Mono', monospace" }}>
              長押しで並び替え　／　タグをタップして変更
            </div>
          </div>

          <button onClick={() => setShowModal(true)} style={{ position: "fixed", bottom: "calc(28px + env(safe-area-inset-bottom))", right: "24px", width: "58px", height: "58px", borderRadius: "50%", background: "linear-gradient(135deg, #3333bb, #5522bb)", border: "none", color: "#fff", fontSize: "28px", cursor: "pointer", boxShadow: "0 4px 20px #3333bb88", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>＋</button>

          {showModal && <AddTaskModal onClose={() => setShowModal(false)} onAdd={t => setTasks(ts => [t, ...ts])} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
